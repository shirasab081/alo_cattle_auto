name: Aloo Image to Video Motion
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts
      - run: |
          cat > run.py << 'PY'
          import asyncio, subprocess, os
          async def main():
              import edge_tts
              text = open("story.txt", encoding="utf-8").read().strip()
              await edge_tts.Communicate(text, "ur-PK-AsadNeural", rate="-10%", volume="+30%").save("voice.mp3")
              dur = float(subprocess.check_output("ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.mp3", shell=True).decode().strip())
              per = max(dur/3, 5)
              # یہ والا فلٹر امیج کو ویڈیو میں بدل دیتا ہے، حرکت دیتا ہے
              for i in [1,2,3]:
                  subprocess.call(f"ffmpeg -y -loop 1 -t {per} -i scene{i}.jpg -vf \"scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=d=1:s=1080x1920:z='if(lte(zoom,1.0),1.2,max(1.001*zoom,1.5))'\" -c:v libx264 -pix_fmt yuv420p -r 30 part{i}.mp4", shell=True)
              open("list.txt","w").write("file 'part1.mp4'\nfile 'part2.mp4'\nfile 'part3.mp4'\n")
              subprocess.call("ffmpeg -y -f concat -safe 0 -i list.txt -i voice.mp3 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest -r 30 video_shorts.mp4", shell=True)
          asyncio.run(main())
          PY
          python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-motion-video
          path: video_shorts.mp4
