name: Aloo Final Urdu Voice
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts
      - name: Generate 15 Sec Video
        run: |
          cat > run.py << 'PY'
          import asyncio, subprocess, os
          async def main():
              import edge_tts
              # اگر story.txt نہ ہو تو خود بن جائے گی
              if not os.path.exists("story.txt"):
                  with open("story.txt","w",encoding="utf-8") as f:
                      f.write("السلام علیکم! میں ہوں آلو کسان۔ صبح میں کھیت میں گیا، دوپہر کو فصل کو کھاد دی، شام کو رانی گائے نے بیس کلو دودھ دیا۔")
              
              text = open("story.txt", encoding="utf-8").read().strip()
              print(f"Story: {text}")

              # صاف اردو آواز
              await edge_tts.Communicate(text, "ur-PK-AsadNeural", rate="-10%", volume="+30%").save("voice.mp3")
              
              dur = float(subprocess.check_output("ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.mp3", shell=True).decode().strip())
              per = max(dur/3, 5.0)
              print(f"Voice Duration: {dur} sec, Per Scene: {per} sec")

              for i in [1,2,3]:
                  subprocess.call(f"ffmpeg -y -loop 1 -t {per} -i scene{i}.jpg -c:v libx264 -pix_fmt yuv420p -vf scale=1080:1920 -r 30 part{i}.mp4", shell=True)
              
              open("list.txt","w").write("file 'part1.mp4'\nfile 'part2.mp4'\nfile 'part3.mp4'\n")
              subprocess.call("ffmpeg -y -f concat -safe 0 -i list.txt -i voice.mp3 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest -r 30 video_shorts.mp4", shell=True)
              print("Video Ready 15 sec!")

          asyncio.run(main())
          PY
          python run.py
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: aloo-final-video
          path: video_shorts.mp4
