name: Aloo Cattle Shorts
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
          pip install edge-tts pillow
      - run: |
          cat > main.py << 'PY'
          import asyncio, random, os, textwrap
          from PIL import Image, ImageDraw, ImageFont
          VOICE="ur-PK-AsadNeural"
          STORIES=[
              "السلام علیکم! میں ہوں آلو کسان۔ آج آلو کی فصل زبردست ہوئی ہے۔ ہماری کیٹل فارم کی خالص کھاد سے آلو موٹے اور صحت مند ہوئے ہیں۔ آج رانی گائے نے بھی بیس کلو خالص دودھ دیا ہے۔ اللہ کا شکر ہے۔",
          ]
          async def main():
              kahani=STORIES[0]
              open("kahani.txt","w",encoding="utf-8").write(kahani)
              try:
                  import edge_tts
                  await edge_tts.Communicate(kahani, VOICE).save("voice.mp3")
              except:
                  os.system("ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 18 -acodec libmp3lame voice.mp3")
              W,H=1080,1920
              # Aapki wali file se
              img_path="IMG-20261011-WA5557.jpg"
              if os.path.exists(img_path):
                  base=Image.open(img_path).convert("RGB").resize((1080,1920))
              else:
                  base=Image.new('RGB',(W,H),color=(100,60,20))
              img=base.copy()
              d=ImageDraw.Draw(img,"RGBA")
              d.rectangle([0,1200,1080,1920],fill=(255,255,235,230))
              try:
                  title_font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 60)
                  text_font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 35)
              except:
                  title_font=text_font=ImageFont.load_default()
              d.text((30,1220),"ALOO CATTLE FARM",font=title_font,fill=(0,100,0))
              lines=textwrap.wrap("Aloo ki fasal zabardast! Khalis khaad se motay taza aloo.",width=28)
              y=1320
              for line in lines:
                  d.text((30,y),line,font=text_font,fill=(0,0,0))
                  y+=60
              d.text((30,1780),"LIKE | SUBSCRIBE | SHARE",font=text_font,fill=(200,0,0))
              img.save("bg.jpg",quality=95)
              os.system("ffmpeg -y -loop 1 -framerate 1 -i bg.jpg -i voice.mp3 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest -vf scale=1080:1920 video_shorts.mp4")
              os.system("ls -lh")
          asyncio.run(main())
          PY
          python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-shorts-video
          path: |
            *.mp4
            *.jpg
