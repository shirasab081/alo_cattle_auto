name: Aloo Cattle Auto
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts
      - run: ls -R
      - run: python main.py || python alo_cattle_auto/main.py || python alo_cattle_auto/alo_cattle_auto/main.py
