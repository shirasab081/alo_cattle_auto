name: Aloo Viral Video Auto
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts Pillow
      - name: Generate
        run: |
          python -c "
          import requests, os, time, subprocess
          from PIL import Image
          os.system('edge-tts --voice en-US-GuyNeural --text \"Cute Aloo story, I am now everyone favourite fries\" --write-media voice.mp3')
          def get_img(p, n):
              url = f'https://image.pollinations.ai/prompt/{requests.utils.quote(p)}?width=720&height=1280'
              for i in range(6):
                  try:
                      r = requests.get(url, timeout=120)
                      if len(r.content)>10000:
                          open(n+'.jpg','wb').write(r.content)
                          break
                  except: time.sleep(5)
              else:
                  Image.new('RGB',(720,1280),(255,220,100)).save(n+'.jpg')
          for idx, pr in enumerate(['cute potato smiling','scared potato','fries with sunglasses','fries pack hearts']):
              get_img(pr, f'scene{idx+1}')
          [subprocess.call(f'ffmpeg -y -loop 1 -i scene{i}.jpg -c:v libx264 -t 3.8 -vf scale=720:1280 -pix_fmt yuv420p -r 30 temp{i}.mp4', shell=True) for i in range(1,5)]
          open('inputs.txt','w').write(\"file 'temp1.mp4'\nfile 'temp2.mp4'\nfile 'temp3.mp4'\nfile 'temp4.mp4'\n\")
          subprocess.call('ffmpeg -y -f concat -safe 0 -i inputs.txt -i voice.mp3 -c:v libx264 -c:a aac -shortest final_aloo_viral.mp4', shell=True)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-viral-video
          path: final_aloo_viral.mp4
