name: Aloo Cattle Auto
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts pillow
      - run: |
          cat > main.py << 'PY'
          import asyncio, random, os, textwrap
          from PIL import Image, ImageDraw
          VOICE="ur-PK-AsadNeural"
          STORIES=[
              "Assalam o Alaikum! Main hun Aloo Kisan. Aaj meri gaaye ne bohat doodh diya. Allah ka shukar hai. Aloo ke khet me bhi behtreen fasal hui hai.",
              "Aaj aloo ke khet me zabardast fasal hui hai. Cattle farm ki khalis khaad se aloo motay hue hain. Gaayen bhi khush hain.",
              "Aaj farm par ek nayi khubsurat bachri paida hui hai, humne uska naam Rani rakha hai. Rani bohat pyari hai."
          ]
          async def main():
              k=random.choice(STORIES)
              open("kahani.txt","w",encoding="utf-8").write(k)
              print(k)
              try:
                  import edge_tts
                  await edge_tts.Communicate(k, VOICE).save("voice.mp3")
              except Exception as e:
                  print(f"TTS fail {e}")
                  os.system("ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 10 -acodec libmp3lame voice.mp3")
              # HD Image 1920x1080
              W,H=1920,1080
              img=Image.new('RGB',(W,H),color=(20,90,20))
              d=ImageDraw.Draw(img)
              d.rounded_rectangle([60,60,1860,1020],radius=40,fill=(255,255,225),outline=(255,215,0),width=10)
              d.text((100,100),"ALOO CATTLE FARM - FULL HD 1080p",fill=(0,80,0))
              lines=textwrap.wrap(k,width=55)
              y=250
              for line in lines:
                  d.text((100,y),line,fill=(0,0,0))
                  y+=70
              d.text((100,900),"Like | Share | Subscribe",fill=(200,0,0))
              img.save("bg.jpg",quality=95)
              # VIDEO - 100% working command
              cmd="ffmpeg -y -loop 1 -framerate 1 -i bg.jpg -i voice.mp3 -c:v libx264 -tune stillimage -c:a aac -b:a 192k -pix_fmt yuv420p -shortest video_hd.mp4"
              print(cmd)
              os.system(cmd)
              os.system("ls -lh && ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.mp3 || true")
          asyncio.run(main())
          PY
          python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-HD-video
          path: |
            *.mp4
            *.jpg
            *.mp3
            *.txt
