name: Aloo No Watermark Urdu
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (Urdu me likho)'
        required: true
        default: 'Aloo ki emotional kahani'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts Pillow

      - name: Generate Video Urdu
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python -c "
          import os, requests, time, subprocess
          topic = os.getenv('TOPIC', 'Aloo ki kahani')

          # 1. URDU STORY - Original general story
          story_urdu = f'Ek tha chota sa aloo, {topic}. Sab usay nazar andaz karte thay. Ek din usay utha liya gaya, wo bohat dara. Lekin phir wo sunahri fries ban gaya kala chashma pehen kar. Ab sab us se pyar karte hain. Aloo hamesha all rounder hota hai!'
          print(story_urdu)

          # 2. URDU VOICE - Asad Neural (Urdu Male)
          print('Making Urdu Voice...')
          open('voice.txt','w',encoding='utf-8').write(story_urdu)
          os.system('edge-tts --voice ur-PK-AsadNeural --file voice.txt --write-media voice.mp3')
          if not os.path.exists('voice.mp3') or os.path.getsize('voice.mp3') < 5000:
              print('Urdu failed, trying Uzma')
              os.system('edge-tts --voice ur-PK-UzmaNeural --file voice.txt --write-media voice.mp3')

          # 3. IMAGE DOWNLOAD + WATERMARK CUT
          def get_img(prompt, name):
              url = f'https://image.pollinations.ai/prompt/{requests.utils.quote(prompt)}?width=768&height=1366&nologo=true&enhance=true&model=flux'
              for i in range(5):
                  try:
                      r = requests.get(url, timeout=120)
                      if r.status_code==200 and len(r.content)>20000:
                          open(name+'.jpg','wb').write(r.content)
                          return True
                  except: pass
                  time.sleep(4)
              return False

          # Prompts - Aloo fries story, no text
          get_img(f'cute 3d potato character in basket, pixar style, happy, no text, no watermark, {topic}', 's1')
          get_img(f'cute potato scared being lifted, emotional story, 3d, no text, {topic}', 's2')
          get_img(f'crispy french fries with cool black sunglasses, 3d cute, no text, {topic}', 's3')
          get_img(f'french fries in red cup with heart nugget, yummy, 3d, no text, no logo, {topic}', 's4')

          # 4. EDIT - CROP WATERMARK (neeche wala 8% kaat do)
          for i in range(1,5):
              # pehle watermark wala hissa crop karo, phir 720x1280 banao
              cmd = f'ffmpeg -y -loop 1 -i s{i}.jpg -vf \"crop=iw:ih*0.92:0:0,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280\" -t 3.8 -r 30 -pix_fmt yuv420p temp{i}.mp4'
              subprocess.call(cmd, shell=True)

          open('concat.txt','w').write(\"file 'temp1.mp4'\nfile 'temp2.mp4'\nfile 'temp3.mp4'\nfile 'temp4.mp4'\n\")
          subprocess.call('ffmpeg -y -f concat -safe 0 -i concat.txt -i voice.mp3 -c:v libx264 -c:a aac -shortest -r 30 final_aloo_urdu.mp4', shell=True)
          "

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aloo-Urdu-No-Watermark
          path: final_aloo_urdu.mp4
