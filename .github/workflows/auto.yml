name: Aloo Real Scene Change
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts pillow
      - run: |
          cat > run.py << 'PY'
          import asyncio, subprocess, os
          async def main():
              import edge_tts
              story = open("story.txt", encoding="utf-8").read() if os.path.exists("story.txt") else "Assalamualaikum main hun Aloo kisan. Aaj meri fasal tayar hai. Subah main khet mein gaya. Dopahar ko maine khaad dali. Shaam ko Rani gaaye ne bees kilo doodh diya. Allah ka shukar hai."
              await edge_tts.Communicate(story, "ur-PK-AsadNeural").save("voice.mp3")
              dur = float(subprocess.check_output("ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.mp3", shell=True))
              per = dur / 3
              for i in [1,2,3]:
                  os.system(f"ffmpeg -y -loop 1 -t {per} -i scene{i}.jpg -c:v libx264 -pix_fmt yuv420p -vf scale=1080:1920 -r 30 part{i}.mp4")
              open("list.txt","w").write("file 'part1.mp4'\nfile 'part2.mp4'\nfile 'part3.mp4'\n")
              os.system("ffmpeg -y -f concat -safe 0 -i list.txt -i voice.mp3 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest -r 30 video_shorts.mp4")
              print("Video ready!")
          asyncio.run(main())
          PY
          python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-final-video
          path: video_shorts.mp4
