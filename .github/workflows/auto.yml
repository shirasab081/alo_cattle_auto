name: Aloo Auto Story Video
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
          pip install edge-tts pillow
      - run: |
          cat > main.py << 'PY'
          import asyncio, os, re, subprocess, textwrap
          from PIL import Image, ImageDraw, ImageFont

          VOICE="ur-PK-AsadNeural"
          
          # یہاں آپ روز کہانی بدلیں گے، باقی کام آٹو ہوگا
          # آپ چاہیں تو story.txt فائل بنا کر اس میں کہانی لکھ دیں
          if os.path.exists("story.txt"):
              STORY = open("story.txt", encoding="utf-8").read().strip()
          else:
              STORY = """السلام علیکم! میں ہوں آلو کسان۔ آج میری فصل تیار ہے۔ صبح میں کھیت میں گیا۔ دوپہر کو میں نے کھاد ڈالی۔ شام کو رانی گائے نے بیس کلو دودھ دیا۔ اللہ کا شکر ہے۔"""

          print(f"STORY: {STORY}")

          # کہانی کو سین میں توڑنا - ہر جملے سے ایک سین
          sentences = re.split(r'[۔.!?]', STORY)
          sentences = [s.strip() for s in sentences if len(s.strip())>5]
          if len(sentences) < 3:
              sentences = [STORY[i:i+40] for i in range(0, len(STORY), 40)]
          print(f"Scenes: {len(sentences)}")

          async def make_voice():
              import edge_tts
              await edge_tts.Communicate(STORY, VOICE).save("voice.mp3")

          async def main():
              await make_voice()
              # وائس کی ٹوٹل لمبائی
              dur = float(subprocess.check_output("ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice.mp3", shell=True))
              per_scene = dur / len(sentences)
              print(f"Duration {dur}, per scene {per_scene}")

              W,H = 1080,1920
              
              # CHARACTER LOCK - ایک ہی کریکٹر کی تصویر کو ہر جگہ استعمال کرنا
              char_path = None
              for name in ["IMG-20261011-WA5557.jpg", "character.jpg", "farm.jpg", "aloo.jpg"]:
                  if os.path.exists(name):
                      char_path = name
                      break
              
              # آپ کی جو ویڈیو والی آلو کی تصویر ہے اسی کو ریفرنس بنائیں گے
              # اگر نہیں ملی تو ایک نیا کریکٹر بنائیں گے لیکن ایک ہی رہے گا
              if char_path:
                  char_img = Image.open(char_path).convert("RGBA").resize((700, 900))
              else:
                  char_img = None

              video_parts = []
              # بیک گراؤنڈ سین
              bg_colors = [(139, 69, 19), (34, 139, 34), (70, 130, 180), (210, 180, 140), (100, 60, 20)]
              bg_names = ["کھیت میں", "کیٹل فارم پر", "باورچی خانے میں", "منڈی میں", "گھر میں"]

              for i, sentence in enumerate(sentences):
                  print(f"Making scene {i+1}: {sentence[:30]}")
                  bg_color = bg_colors[i % len(bg_colors)]
                  base = Image.new('RGB', (W,H), color=bg_color)
                  draw = ImageDraw.Draw(base, "RGBA")
                  
                  # بیک گراؤنڈ میں لکھیں کہ کونسی جگہ ہے
                  draw.rectangle([0,0,W,300], fill=(0,0,0,100))
                  try:
                      f_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 50)
                      f_text = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 38)
                  except:
                      f_title = f_text = ImageFont.load_default()
                  
                  draw.text((30,30), f"Scene {i+1}: {bg_names[i % len(bg_names)]}", font=f_title, fill=(255,255,255))
                  
                  # کریکٹر کو ہر سین میں ایک ہی جگہ پیسٹ کرو - CHARACTER LOCK
                  if char_img:
                      base.paste(char_img, (190, 350), char_img)
                  else:
                      # فال بیک کارٹون آلو
                      draw.ellipse([340, 400, 740, 800], fill=(222,184,135), outline=(80,40,10), width=6)

                  # نیچے وائس والا ٹیکسٹ
                  draw.rectangle([0,1350,1080,1920], fill=(255,255,240,235))
                  draw.text((30,1370), "🥔 ALOO CATTLE FARM", font=f_title, fill=(0,100,0))
                  wrapped = textwrap.wrap(sentence, width=26)
                  y=1450
                  for line in wrapped[:4]:
                      draw.text((30,y), line, font=f_text, fill=(0,0,0))
                      y+=55
                  draw.text((30,1780), "LIKE | SUBSCRIBE | SHARE", font=f_text, fill=(200,0,0))
                  
                  img_path = f"scene_{i}.jpg"
                  base.save(img_path, quality=90)
                  v_path = f"part_{i}.mp4"
                  os.system(f"ffmpeg -y -loop 1 -t {per_scene} -i {img_path} -c:v libx264 -pix_fmt yuv420p -vf scale=1080:1920 {v_path}")
                  video_parts.append(v_path)

              # سب جوڑو + وائس
              with open("list.txt","w") as f:
                  for v in video_parts:
                      f.write(f"file '{v}'\n")
              os.system("ffmpeg -y -f concat -safe 0 -i list.txt -i voice.mp3 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest video_shorts.mp4")
              print("DONE")

          asyncio.run(main())
          PY
          python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: aloo-shorts-video
          path: |
            *.mp4
            *.jpg
