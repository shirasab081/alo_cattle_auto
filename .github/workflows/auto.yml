name: Aloo Real Photos Pictory Style
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic Urdu me'
        default: 'Aloo ke 5 hairan kun fawaid'
      style:
        description: 'cartoon ya real'
        default: 'real'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts Pillow

      - name: Build Video
        env:
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
        run: |
          python -c "
          import os, requests, time, subprocess, random
          topic=os.getenv('TOPIC','Aloo ke fawaid')
          style=os.getenv('STYLE','real')

          # Urdu story
          story = f'{topic}. Aloo Allah ki naimat hai. Aloo me vitamin C aur potassium hota hai. Aloo se taqat milti hai. Aloo har ghar ki zarurat hai. Aloo se kisan khush haal hota hai.'
          open('voice.txt','w',encoding='utf-8').write(story)
          os.system('edge-tts --voice ur-PK-AsadNeural --file voice.txt --write-media voice.mp3')

          # Get Images
          def get_real_images(query, count=4):
              # Pexels free search without key (scraping) + Pollinations backup
              for i in range(count):
                  q = f'{query} potato farm real photo' if style=='real' else f'cute 3d potato {query}'
                  url = f'https://image.pollinations.ai/prompt/{requests.utils.quote(q)}?width=768&height=1366&nologo=true&model=flux&enhance=true&seed={random.randint(1,999999)}'
                  try:
                      r=requests.get(url,timeout=90)
                      open(f's{i+1}.jpg','wb').write(r.content)
                  except: pass
                  time.sleep(3)

          get_real_images(topic, 4)

          # Editing - No watermark crop + Ken Burns effect (Pictory jaisa zoom)
          for i in range(1,5):
              # Zoom pan effect + crop watermark
              cmd = f'ffmpeg -y -loop 1 -i s{i}.jpg -vf \"crop=iw:ih*0.92:0:0,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=d=1:s=720x1280:fps=30:z=\'min(pzoom+0.0015,1.3)\'\" -t 4 -r 30 temp{i}.mp4'
              subprocess.call(cmd, shell=True)

          open('concat.txt','w').write(\"\\n\".join([f\"file 'temp{i}.mp4'\" for i in range(1,5)]))
          subprocess.call('ffmpeg -y -f concat -safe 0 -i concat.txt -i voice.mp3 -c:v libx264 -c:a aac -shortest final_pictory_aloo.mp4', shell=True)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: Pictory-Style-Aloo-Video
          path: final_pictory_aloo.mp4