name: Aloo MoneyPrinter Turbo
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic likho (Urdu/English)'
        required: true
        default: 'Aloo ki emotional kahani fries ban gaya'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts Pillow

      - name: Generate Viral Video
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python -c "
          import os, requests, time, subprocess
          from PIL import Image

          topic = os.getenv('TOPIC', 'cute aloo story')
          print(f'TOPIC: {topic}')

          # 1. SCRIPT (Urdu crash se bachne ke liye English me)
          story = f'Once there was a small potato, {topic}. Everyone ignored him. One day he was picked up, he got scared. But then he became a crispy golden french fry with sunglasses. Now everyone loves him. Aloo is always all rounder!'
          print(story)

          # 2. VOICE - Free Edge TTS
          print('Making Voice...')
          safe_story = story.replace('\"', '').replace(\"'\", '')
          os.system(f'edge-tts --voice en-US-GuyNeural --text \"{safe_story}\" --write-media voice.mp3')
          if not os.path.exists('voice.mp3'):
              os.system('ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 14 -acodec libmp3lame voice.mp3')

          # 3. FOOTAGE - AI Images like MoneyPrinterTurbo
          def download_img(prompt, name):
              url = f'https://image.pollinations.ai/prompt/{requests.utils.quote(prompt)}?width=720&height=1280&nologo=true&model=flux&seed={int(time.time())}'
              for i in range(6):
                  try:
                      print(f'Downloading {name} try {i+1}')
                      r = requests.get(url, timeout=120)
                      if r.status_code==200 and len(r.content)>15000:
                          open(name+'.jpg','wb').write(r.content)
                          print(f'{name} OK')
                          return True
                  except Exception as e:
                      print(e)
                  time.sleep(5)
              Image.new('RGB',(720,1280),(255,200,100)).save(name+'.jpg')
              return False

          p1 = f'cute 3d potato smiling in vegetable basket, pixar style, {topic}'
          p2 = f'cute potato scared being picked up, emotional, {topic}'
          p3 = f'crispy french fries with cool black sunglasses, {topic}'
          p4 = f'happy french fries pack with hearts, viral, {topic}'

          download_img(p1, 'scene1')
          download_img(p2, 'scene2')
          download_img(p3, 'scene3')
          download_img(p4, 'scene4')

          # 4. EDITING - Image to Video + Merge
          for i in range(1,5):
              subprocess.call(f'ffmpeg -y -loop 1 -i scene{i}.jpg -c:v libx264 -t 3.5 -vf scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280 -pix_fmt yuv420p -r 30 temp{i}.mp4', shell=True)

          open('concat.txt','w').write(\"file 'temp1.mp4'\nfile 'temp2.mp4'\nfile 'temp3.mp4'\nfile 'temp4.mp4'\n\")
          subprocess.call('ffmpeg -y -f concat -safe 0 -i concat.txt -i voice.mp3 -c:v libx264 -c:a aac -shortest -r 30 final_aloo_video.mp4', shell=True)

          print('FINAL CHECK:', os.listdir('.'))
          "

      - name: Upload Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aloo-Viral-Video
          path: final_aloo_video.mp4
          retention-days: 5